<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Social card</title>
<!-- The image shown when a link to this site is shared: assets/social.png,
     1200x630, the size link previews expect. Jekyll skips this folder (its name
     starts with an underscore), so it is not part of the site. It draws the
     home page's board with the home page's own scripts and styles, so the card
     follows the site. To remake the PNG, from the repository root:

       python3 -m http.server 8765 &
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
         --hide-scrollbars --window-size=1200,630 --virtual-time-budget=2000 \
         --screenshot=assets/social.png "http://127.0.0.1:8765/_social/card.html?p=0"

     ?p=0 is the Immortal Game: a full board reads better at thumbnail size
     than the Réti study's four pieces. -->
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: flex; align-items: center; gap: 56px; padding: 0 64px 0 72px; box-sizing: border-box; }
  .text { flex: 1; }
  .name { display: block; font-size: 28px; margin-bottom: 40px; }
  h1 { font-size: 56px; margin-bottom: 40px; }
  .url { color: var(--accent); font-size: 24px; font-weight: 500; }
  #board { width: 500px; height: 500px; flex: none; }
  /* board.js writes to these; the card does not show them. */
  #caption, #lichess, #another { display: none; }
</style>
</head>
<body>

    <style>
      h1 .nw { white-space: nowrap; }
      h1 .h1-chip { display:inline-block; width:.78em; height:.8em; vertical-align:-.06em; }
      h1 .h1-knight { display:inline-block; width:.95em; height:.95em; vertical-align:-.12em; fill: var(--accent); }
      /* Same knight and same eyelids as on the board (kiwen-suwi, credited under the board); here the blink is a CSS loop. */
      h1 .h1-knight .lid { animation: h1blink 8s ease-in-out infinite; }
      @keyframes h1blink { 0%, 60%, 64%, 100% { transform: scaleY(0); } 62% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { h1 .h1-knight .lid { animation: none; } }
    </style>
    <div class="url">fcardinaux.github.io</div>

    <style>
      /* Chip pins along the top and right edges of the board: a separate layer, the board itself is unchanged. */
      .boardbox { position: relative; width: 500px; height: 500px; flex: none; }
      svg.board-pins { position: absolute; top: 0; left: 0; width: 500px; height: 500px; overflow: visible; pointer-events: none; fill: var(--pin); }
      :root { --pin: #33403b; }
      @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --pin: #cfcdc6; } }
      :root[data-theme="light"] { --pin: #cfcdc6; }
    </style>
  <span id="caption"></span><a id="lichess"></a><button id="another" type="button"></button>
