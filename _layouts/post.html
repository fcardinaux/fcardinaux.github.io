---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time></p>
  {% if page.archived %}
  <p class="archived">An archived post from {{ page.date | date: "%Y" }}, kept so that old links
  still work. It may be out of date.</p>
  {% endif %}
  <div class="post-content">
    {{ content }}
  </div>
</article>
